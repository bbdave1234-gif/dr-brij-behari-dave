<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog | Dr. Brij Behari Dave</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <nav>
    <a href="index.html" class="brand">Dr. Brij Behari Dave</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="publications.html">Publications</a>
      <a href="blog.html">Blog</a>
      <a href="upload.html">Upload a Paper</a>
      <a href="write-post.html">Write a Post</a>
    </div>
  </nav>
</header>

<main>
  <div class="container">
    <h1>Blog</h1>

    <div class="counter-banner">
      <span class="count" id="blog-count">&hellip;</span>
      <span class="label" id="blog-count-label">posts published</span>
    </div>

    <p class="loading-state" id="loading">Loading posts&hellip;</p>
    <p class="error-state" id="error" style="display:none;"></p>
    <p class="empty-state" id="empty" style="display:none;">No posts yet. <a href="write-post.html">Write the first one</a>.</p>

    <div id="list"></div>

    <p style="margin-top: 32px;"><a class="btn secondary" href="write-post.html">Write a New Post</a></p>
  </div>
</main>

<footer class="site-footer">&copy; <span id="year"></span> Dr. Brij Behari Dave</footer>

<script src="config.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  fetchRows("blogs")
    .then((rows) => {
      const posts = rows.filter((r) => r.title)
        .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

      document.getElementById("loading").style.display = "none";
      document.getElementById("blog-count").textContent = posts.length;
      document.getElementById("blog-count-label").textContent =
        (posts.length === 1 ? "post" : "posts") + " published";
      document.getElementById("empty").style.display = posts.length ? "none" : "block";

      const list = document.getElementById("list");
      posts.forEach((p) => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML =
          '<h3 class="title">' + p.title + "</h3>" +
          '<div class="meta">' + (p.date || "") + "</div>" +
          '<div class="content">' + (p.content || "") + "</div>" +
          (p.link ? '<div class="card-footer" style="margin-top:12px;"><a class="btn secondary" href="' + p.link + '" target="_blank" rel="noreferrer">Read more</a></div>' : "");
        list.appendChild(div);
      });
    })
    .catch((err) => {
      document.getElementById("loading").style.display = "none";
      document.getElementById("error").style.display = "block";
      document.getElementById("error").textContent = err.message;
    });
</script>

</body>
</html>
